prompts: [./prompt.js]

providers:
  - id: openai:gpt-4o-mini
    config:
      response_format:
        type: json_schema
        json_schema:
          name: output
          description: 블로그 분석 리포트 v2
          schema:
            type: object
            properties:
              character:
                type: object
                properties:
                  animal:
                    type: string
                    enum:
                      - 앵무새
                      - 돌고래
                      - 카멜레온
                      - 매
                      - 강아지
                      - 늑대
                      - 올빼미
                      - 사자
                  summary:
                    type: string
                required: [animal, summary]
              representativePost:
                type: object
                properties:
                  title:
                    type: string
                  link:
                    type: string
                    format: uri
                  coreSentence:
                    type: string
                  explanation:
                    type: string
                required: [title, link, coreSentence, explanation]
              blogTendency:
                type: object
                properties:
                  nightMorning:
                    $ref: "#/$defs/TendencyAxis"
                  narrativeImpact:
                    $ref: "#/$defs/TendencyAxis"
                  trendEssence:
                    $ref: "#/$defs/TendencyAxis"
                  communicationUnilateral:
                    $ref: "#/$defs/TendencyAxis"
                  completeGrowth:
                    $ref: "#/$defs/TendencyAxis"
                required:
                  - nightMorning
                  - narrativeImpact
                  - trendEssence
                  - communicationUnilateral
                  - completeGrowth
              mbtiPrediction:
                type: object
                properties:
                  result:
                    type: string
                    enum:
                      - ISTJ
                      - ISFJ
                      - INFJ
                      - INTJ
                      - ISTP
                      - ISFP
                      - INFP
                      - INTP
                      - ESTP
                      - ESFP
                      - ENFP
                      - ENTP
                      - ESTJ
                      - ESFJ
                      - ENFJ
                      - ENTJ
                  confidence:
                    type: object
                    properties:
                      E/I:
                        $ref: "#/$defs/MBTIAxisConfidence"
                      S/N:
                        $ref: "#/$defs/MBTIAxisConfidence"
                      T/F:
                        $ref: "#/$defs/MBTIAxisConfidence"
                      J/P:
                        $ref: "#/$defs/MBTIAxisConfidence"
                    required: [E/I, S/N, T/F, J/P]
                required: [result, confidence]
              fortune:
                type: object
                properties:
                  warnings:
                    type: array
                    items:
                      $ref: "#/$defs/FortuneItem"
                    minItems: 2
                    maxItems: 2
                  directions:
                    type: array
                    items:
                      $ref: "#/$defs/FortuneItem"
                    minItems: 2
                    maxItems: 2
                required: [warnings, directions]
            required:
              - character
              - representativePost
              - blogTendency
              - mbtiPrediction
              - fortune
            $defs:
              TendencyAxis:
                type: object
                properties:
                  score:
                    type: number
                    minimum: 0
                    maximum: 100
                  label:
                    type: string
                  description:
                    type: string
                required: [score, label, description]
              MBTIEvidence:
                type: object
                properties:
                  title:
                    type: string
                  quote:
                    type: string
                  link:
                    type: string
                    format: uri
                required: [title, quote, link]
              MBTIAxisConfidence:
                type: object
                properties:
                  score:
                    type: number
                    minimum: 0
                    maximum: 100
                  selected:
                    type: string
                  explanation:
                    type: string
                  evidence:
                    $ref: "#/$defs/MBTIEvidence"
                required: [score, selected, explanation, evidence]
              FortuneItem:
                type: object
                properties:
                  content:
                    type: string
                  basedOn:
                    type: string
                required: [content, basedOn]

tests:
  - vars: {}
    assert:
      # 1. 전체 스키마 구조 검증
      - type: javascript
        value: |
          function validateSchema(output) {
            const required = ['character', 'representativePost', 'blogTendency', 'mbtiPrediction', 'fortune'];
            const missing = required.filter(k => !output[k]);
            return {
              pass: missing.length === 0,
              score: missing.length === 0 ? 1 : 0,
              reason: missing.length === 0 ? 'All sections present' : `Missing: ${missing.join(', ')}`
            };
          }
          return validateSchema(output);

      # 2. MBTI 각 축에 evidence 존재 검증
      - type: javascript
        value: |
          function validateMBTIEvidence(output) {
            const axes = ['E/I', 'S/N', 'T/F', 'J/P'];
            for (const axis of axes) {
              const confidence = output.mbtiPrediction?.confidence?.[axis];
              if (!confidence?.evidence) {
                return { pass: false, score: 0, reason: `${axis} missing evidence` };
              }
              const { title, quote, link } = confidence.evidence;
              if (!title || !quote || !link) {
                return { pass: false, score: 0, reason: `${axis} evidence incomplete` };
              }
              try {
                new URL(link);
              } catch {
                return { pass: false, score: 0, reason: `${axis} invalid link: ${link}` };
              }
            }
            return { pass: true, score: 1, reason: 'All MBTI evidence valid' };
          }
          return validateMBTIEvidence(output);

      # 3. MBTI evidence quote가 입력에 존재하는지 검증
      - type: javascript
        value: |
          function validateQuotesInInput(output, context) {
            if (!context.vars?.user_prompt) {
              return { pass: false, score: 0, reason: 'user_prompt missing' };
            }
            const axes = ['E/I', 'S/N', 'T/F', 'J/P'];
            const userPrompt = context.vars.user_prompt;

            for (const axis of axes) {
              const quote = output.mbtiPrediction?.confidence?.[axis]?.evidence?.quote;
              if (!quote) continue;

              // 핵심 키워드(5글자 이상) 부분 일치 허용
              const keywords = quote.split(' ').filter(w => w.length >= 5);
              const hasKeyword = keywords.some(kw => userPrompt.includes(kw));

              if (!hasKeyword && !userPrompt.includes(quote)) {
                return { pass: false, score: 0, reason: `${axis} quote not in input: "${quote}"` };
              }
            }
            return { pass: true, score: 1, reason: 'All quotes exist in input' };
          }
          return validateQuotesInInput(output, context);

      # 4. MBTI evidence link가 제공된 링크 중 하나인지 검증
      - type: javascript
        value: |
          function validateLinksFromInput(output, context) {
            if (!context.vars?.user_prompt) {
              return { pass: true, score: 1, reason: 'No input to validate' };
            }

            // "- 링크: https://..." 패턴 추출
            const linkPattern = /- 링크: (https?:\/\/[^\s]+)/g;
            const inputLinks = [];
            let match;
            while ((match = linkPattern.exec(context.vars.user_prompt)) !== null) {
              inputLinks.push(match[1]);
            }

            if (inputLinks.length === 0) {
              return { pass: true, score: 1, reason: 'No links in input' };
            }

            const axes = ['E/I', 'S/N', 'T/F', 'J/P'];
            for (const axis of axes) {
              const link = output.mbtiPrediction?.confidence?.[axis]?.evidence?.link;
              if (!link) continue;

              if (!inputLinks.includes(link)) {
                return { pass: false, score: 0, reason: `${axis} link not from input: ${link}` };
              }
            }
            return { pass: true, score: 1, reason: 'All links from input' };
          }
          return validateLinksFromInput(output, context);

      # 5. representativePost 검증
      - type: javascript
        value: |
          function validateRepPost(output) {
            const rep = output.representativePost;
            if (!rep?.title || !rep?.link || !rep?.coreSentence || !rep?.explanation) {
              return { pass: false, score: 0, reason: 'RepresentativePost incomplete' };
            }
            try {
              new URL(rep.link);
            } catch {
              return { pass: false, score: 0, reason: 'Invalid rep post link' };
            }
            return { pass: true, score: 1, reason: 'RepresentativePost valid' };
          }
          return validateRepPost(output);

      # 6. character 검증
      - type: javascript
        value: |
          function validateCharacter(output) {
            const animals = ['앵무새', '돌고래', '카멜레온', '매', '강아지', '늑대', '올빼미', '사자'];
            const char = output.character;
            if (!char?.animal || !animals.includes(char.animal)) {
              return { pass: false, score: 0, reason: `Invalid animal: ${char?.animal}` };
            }
            if (!char?.summary || char.summary.length < 10) {
              return { pass: false, score: 0, reason: 'Summary too short' };
            }
            return { pass: true, score: 1, reason: 'Character valid' };
          }
          return validateCharacter(output);

      # 7. blogTendency 5개 축 검증
      - type: javascript
        value: |
          function validateTendency(output) {
            const axes = ['nightMorning', 'narrativeImpact', 'trendEssence', 'communicationUnilateral', 'completeGrowth'];
            for (const axis of axes) {
              const t = output.blogTendency?.[axis];
              if (t?.score === undefined || t.score < 0 || t.score > 100) {
                return { pass: false, score: 0, reason: `${axis} invalid score: ${t?.score}` };
              }
              if (!t?.label || !t?.description) {
                return { pass: false, score: 0, reason: `${axis} missing label/desc` };
              }
            }
            return { pass: true, score: 1, reason: 'All tendency axes valid' };
          }
          return validateTendency(output);

      # 8. fortune 검증
      - type: javascript
        value: |
          function validateFortune(output) {
            const fortune = output.fortune;
            if (!fortune?.warnings || fortune.warnings.length !== 2) {
              return { pass: false, score: 0, reason: `Warnings count: ${fortune?.warnings?.length}, expected 2` };
            }
            if (!fortune?.directions || fortune.directions.length !== 2) {
              return { pass: false, score: 0, reason: `Directions count: ${fortune?.directions?.length}, expected 2` };
            }
            // 각 항목에 content와 basedOn이 있는지 확인
            const allWarningsValid = fortune.warnings.every(w => w?.content && w?.basedOn);
            const allDirectionsValid = fortune.directions.every(d => d?.content && d?.basedOn);
            if (!allWarningsValid || !allDirectionsValid) {
              return { pass: false, score: 0, reason: 'Fortune items missing content or basedOn' };
            }
            return { pass: true, score: 1, reason: 'Fortune valid' };
          }
          return validateFortune(output);

      # 9. MBTI result와 confidence.selected 일치 검증
      - type: javascript
        value: |
          function validateMBTIConsistency(output) {
            const result = output.mbtiPrediction?.result;
            const confidence = output.mbtiPrediction?.confidence;
            if (!result || !confidence) {
              return { pass: false, score: 0, reason: 'MBTI result or confidence missing' };
            }

            const expectedEI = result[0]; // E or I
            const expectedSN = result[1]; // S or N
            const expectedTF = result[2]; // T or F
            const expectedJP = result[3]; // J or P

            const actualEI = confidence['E/I']?.selected;
            const actualSN = confidence['S/N']?.selected;
            const actualTF = confidence['T/F']?.selected;
            const actualJP = confidence['J/P']?.selected;

            if (actualEI !== expectedEI) {
              return { pass: false, score: 0, reason: `E/I mismatch: result=${expectedEI}, selected=${actualEI}` };
            }
            if (actualSN !== expectedSN) {
              return { pass: false, score: 0, reason: `S/N mismatch: result=${expectedSN}, selected=${actualSN}` };
            }
            if (actualTF !== expectedTF) {
              return { pass: false, score: 0, reason: `T/F mismatch: result=${expectedTF}, selected=${actualTF}` };
            }
            if (actualJP !== expectedJP) {
              return { pass: false, score: 0, reason: `J/P mismatch: result=${expectedJP}, selected=${actualJP}` };
            }

            return { pass: true, score: 1, reason: 'MBTI result and confidence consistent' };
          }
          return validateMBTIConsistency(output);
